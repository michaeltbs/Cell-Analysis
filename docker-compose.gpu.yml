services:
  cellanalysis:
    build:
      context: .
      target: gpu
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    image: cellanalysis:gpu
    container_name: cellanalysis_gpu
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video,graphics
      - HOST_DATA=${HOST_DATA:-./data}
      - CONTAINER_DATA_ROOT=${HOST_DATA:-/data}
    # Requires Docker engine with nvidia-container-toolkit installed on the host
    gpus:
      - count: -1
    volumes:
      - ./data:/data:rw
      - ./results:/app/results:rw
      - .:/app:rw
