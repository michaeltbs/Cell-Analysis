paths:
  input_pos: "data/projected_tiffs/Input_old"    # Old samples (positive condition)
  input_neg: "data/projected_tiffs/Input_adult"  # Adult samples (negative condition)
  output_root: "results_old_vs_adult_ch2"

cellpose:
  model_name: "cpsam"
  batch_size: 8
  resize_max: 2048
  niter: 750
  flow_threshold: 0.6
  cellprob_threshold: 0.5
  diameter: 25
  save_masks: false
  channel: 2
  split_regions: true

filters:
  min_area: 120
  max_area: 8000
  min_circularity: 0.2
  max_circularity: 1.0
  max_hole_ratio: 0.5
  intensity_threshold_factor: 0.2

enable_advanced_filtering: true

advanced_filtering:
  snr_min: 1.1                 # STARK GESENKT von 1 auf 0.3
  abs_floor_percentile: 70     # STARK GESENKT von 75 auf 30
  foreground_block_size: 501    # STARK GESENKT von 201 auf 51
  foreground_offset: 10       # STARK NEGATIV von -10 auf -30

processing:
  # Preprocessing
  tophat: true            # Enable white-tophat preprocessing
  tophat_radius: 15       # Radius for white-tophat (10–20 typical)
  contrast_stretch: true  # Enable robust contrast stretching
  stretch_percentiles: [1, 99]  # Percentiles for contrast stretching

  # Postprocessing
  merge_adjacent_cells: false
  remove_edge_cells: false
  intensity_threshold: 5     # GESENKT von 10 auf 5

overlays:
  overlay_mode: contours
  contour_color: 'blue'        # Bessere Sichtbarkeit
  line_width: 1                # Dicker für bessere Sichtbarkeit
  dpi: 300                     # Niedriger für kleinere Dateien
  figsize: [12, 12]            # Kleiner

outputs:
  base_name: "cell_analysis"
