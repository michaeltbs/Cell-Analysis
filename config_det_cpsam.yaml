advanced_filtering:
  abs_floor_percentile: 74
  foreground_block_size: 1001
  foreground_offset: 10
  snr_min: 2
cellpose:
  batch_size: 64
  cellprob_threshold: 0.2
  channel: 2
  diameter: 20
  flow_threshold: 0.32
  model_name: cpsam
  niter: 1000
  resize_max: 4096
  save_masks: true
  split_regions: false
  use_gpu: true
conditions:
  neg_pattern: Input_neg_
  pos_pattern: Input_pos_
enable_advanced_filtering: true
filters:
  intensity_threshold_factor: 0.92
  max_area: 8000
  max_circularity: 1
  max_hole_ratio: 0.7
  min_area: 20
  min_circularity: 0.01
outputs:
  base_name: cell_analysis
overlays:
  contour_color: magenta
  dpi: 300
  figsize:
  - 12
  - 12
  line_width: 1
  overlay_mode: contours
paths:
  input_neg: /app/data/Input/TV2/Input_neg
  input_pos: /app/data/Input/TV2/Input_pos
  output_root: /app/results/Test2
processing:
  contrast_stretch: true
  intensity_threshold: 21
  merge_adjacent_cells: false
  remove_edge_cells: false
  split_area_multiplier: 2
  split_min_area: 0
  split_min_distance: 50
  split_rel_peak_threshold: 0.4
  split_touching_cells: true
  stretch_percentiles:
  - 1
  - 100
  tophat: true
  tophat_radius: 20
testing:
  enabled: true
  samples_per_channel: 2
