version: "3.8"

services:
  cellanalysis:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "1000"
        GROUP_ID: "1000"
      target: gpu
    container_name: cellanalysis
    ports:
      - "5000:5000"
    volumes:
      - type: bind
        source: .
        target: /app
        bind:
          create_host_path: true
      - type: bind
        source: ${HOST_DATA:-./data}
        target: /data
        bind:
          create_host_path: true
    environment:
      - FLASK_ENV=production
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video,graphics
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - HOST_DATA=${HOST_DATA:-./data}
      - CONTAINER_DATA_ROOT=${HOST_DATA:-/data}
