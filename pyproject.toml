[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-analysis"
version = "0.1.0"
description = "Cell segmentation and co-expression analysis for confocal microscopy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cellpose>=4.2.1",
    "czifile>=2019.7.2",
    "dask>=2024.0.0",
    "dask-image>=2024.0.0",
    "dask-jobqueue>=0.8.0",
    "distributed>=2024.0.0",
    "fastapi>=0.110.0",
    "fastremap>=1.20.0",
    "fill-voids>=2.1.0",
    "flask==3.0.3",
    "flask-cors==4.0.1",
    "httpx>=0.27.0",
    "matplotlib==3.9.0",
    "nd2>=0.11.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "Pillow==10.3.0",
    "pyyaml>=6.0",
    "readlif>=0.6.0",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "scikit-image==0.24.0",
    "scipy==1.13.1",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.0",
    "tifffile==2024.8.30",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.65.0",
    "uvicorn>=0.27.0",
    "zarr>=2.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "ruff", "fakeredis>=2.0.0"]

[project.scripts]
cell-analysis = "run_pipeline:main"
