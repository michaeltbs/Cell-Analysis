# Beispiel-Konfiguration für CZI → TIFF Konvertierung.
# Passe input_root/output_base an Dein System an oder setze sie per Env-Var / UI.
channel_colors:
- '#ff0000'
- '#00ff00'
- '#0000ff'
- '#ffff00'
channel_names: []
channels:
- 0
- 1
- 2
- 3
dtype: uint16
imagej_hyperstack: true
input_root: ./data/input_czi
output_base: ./data/processed_tiffs
overwrite: true
per_channel_normalize: true
rgb_channels: 0,1,2
save_color_composite: false
save_colored_pages: false
save_ome_colors: false
save_per_channel: false
save_rgb_preview: false
save_stack_tiff: true
stack_layout: CYX
target_size: '2024'
verbose: false
